services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - foundry_bin:/root/.foundry
    ports:
      - "3000:3000"
    environment:
      - FOUNDRY_FUZZ_RUNS=256
      - FOUNDRY_INVARIANT_RUNS=5
      - FOUNDRY_INVARIANT_DEPTH=25
    command: bash /app/.base44/start.sh
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  foundry_bin:
