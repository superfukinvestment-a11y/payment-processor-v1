services:
  app:
    image: node:22
    working_dir: /app/TCB_Notion
    volumes:
      - .:/app
      - tcb_node_modules:/app/TCB_Notion/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: bash -c "npm install --silent && node notion-proxy.js"
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:3000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  tcb_node_modules:
